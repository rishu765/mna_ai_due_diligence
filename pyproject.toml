[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ma-due-diligence"
version = "1.0.0"
description = "Checkpointed, evidence-first M&A due-diligence agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project Maintainer" }]
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1.2.13,<1.3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "pymupdf>=1.24,<2",
  "typing-extensions>=4.12,<5",
  "uvicorn>=0.34,<1",
]

[project.scripts]
madd-vdr-demo = "ma_due_diligence.demo_vdr:main"
madd-financial-demo = "ma_due_diligence.demo_financial:main"
madd-specialist-demo = "ma_due_diligence.demo_specialists:main"
madd-agent-demo = "ma_due_diligence.demo_final:main"
madd-evaluate = "ma_due_diligence.evaluation_final:main"
madd-api = "ma_due_diligence.api_cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_due_diligence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["ma_due_diligence"]

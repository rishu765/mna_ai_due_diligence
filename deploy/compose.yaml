name: madd-pilot-${MADD_ENVIRONMENT:-pilot}

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${MADD_IMAGE:-madd-pilot}:${MADD_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      MADD_PILOT_DATA_DIR: /data-root/${MADD_DATA_SUBDIRECTORY:-current}
      MADD_BIND_HOST: 0.0.0.0
      MADD_PORT: 8000
      MADD_FORWARDED_ALLOW_IPS: ${MADD_FORWARDED_ALLOW_IPS:-*}
      MADD_ALLOWED_HOSTS: ${MADD_PILOT_HOST}
      MADD_ENVIRONMENT: ${MADD_ENVIRONMENT:-pilot}
      MADD_RELEASE_SHA: ${MADD_RELEASE_SHA:-development}
      MADD_DOCUMENT_KEY: ${MADD_DOCUMENT_KEY:?set MADD_DOCUMENT_KEY}
      MADD_CHECKPOINT_KEY: ${MADD_CHECKPOINT_KEY:?set MADD_CHECKPOINT_KEY}
      MADD_BOOTSTRAP_ADMIN_EMAIL: ${MADD_BOOTSTRAP_ADMIN_EMAIL:?set admin email}
      MADD_BOOTSTRAP_ADMIN_PASSWORD: ${MADD_BOOTSTRAP_ADMIN_PASSWORD:?set admin password}
      MADD_BOOTSTRAP_ADMIN_NAME: ${MADD_BOOTSTRAP_ADMIN_NAME:-Pilot Administrator}
      MADD_MAX_UPLOAD_BYTES: ${MADD_MAX_UPLOAD_BYTES:-52428800}
      MADD_LOGIN_ATTEMPT_LIMIT: ${MADD_LOGIN_ATTEMPT_LIMIT:-5}
      MADD_LOGIN_WINDOW_SECONDS: ${MADD_LOGIN_WINDOW_SECONDS:-300}
      MADD_LOGIN_BLOCK_SECONDS: ${MADD_LOGIN_BLOCK_SECONDS:-900}
      MADD_AI_MODE: ${MADD_AI_MODE:-local_demo}
    volumes:
      - pilot_data:/data-root
    expose:
      - "8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MADD_PILOT_HOST: ${MADD_PILOT_HOST:?set pilot hostname}
      MADD_TLS_EMAIL: ${MADD_TLS_EMAIL:?set TLS contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true

  backup:
    image: ${MADD_IMAGE:-madd-pilot}:${MADD_IMAGE_TAG:-local}
    profiles:
      - ops
    command:
      - madd-pilot-backup
      - scheduled
      - /data-root/${MADD_DATA_SUBDIRECTORY:-current}
      - /backups
      - --retain
      - ${MADD_BACKUP_RETAIN_COUNT:-14}
    environment:
      MADD_BACKUP_KEY: ${MADD_BACKUP_KEY:?set MADD_BACKUP_KEY}
    volumes:
      - pilot_data:/data-root
      - pilot_backups:/backups
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pilot_data:
    name: ${MADD_PILOT_DATA_VOLUME:-madd-pilot-${MADD_ENVIRONMENT:-pilot}-data}
  pilot_backups:
    name: ${MADD_PILOT_BACKUP_VOLUME:-madd-pilot-${MADD_ENVIRONMENT:-pilot}-backups}
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
